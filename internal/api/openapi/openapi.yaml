openapi: 3.0.3
info:
  title: lowcode-database API
  description: |
    Postgres-backed low-code table service: dynamic tables, columns, rows, indexes,
    relations, and saved queries.

    Optional HTTP webhooks: `/v1/admin/webhooks`. Out of scope (schema bundle import,
    plugins, graph expand, ENUM, RBAC): see docs/roadmap.md.

    **Multi-tenant:** send `X-Tenant-Id` on every request when `TENANT_MODE=multi`.
    In single-tenant mode the header is optional (default tenant from env).

    **Playground:** [lowcode-database-playground](https://github.com/monoposer/lowcode-database-playground) — AG Grid UI (separate repo).

    Errors are returned as plain text (`http.Error`), not JSON envelopes.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local dev (see HTTP_ADDR in .env)

tags:
  - name: Platform
  - name: Types
  - name: Tables
  - name: Columns
  - name: Indexes
  - name: Schema
  - name: Relations
  - name: Queries

paths:
  /v1/admin/database/connection:
    get:
      tags: [Platform]
      summary: Get tenant database connection info (no password)
      operationId: getDatabaseConnection
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDatabaseConnectionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/tenants:
    post:
      tags: [Platform]
      summary: Provision a tenant (multi-tenant mode)
      operationId: createTenant
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/types:
    get:
      tags: [Types]
      summary: List built-in column types
      operationId: listTypes
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTypesResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/pg-stat-statements:
    get:
      tags: [Platform]
      summary: List pg_stat_statements for the tenant data database
      description: |
        Requires `PG_STAT_STATEMENTS=true`. When disabled, returns `{ "enabled": false, "statements": [] }`.
        Postgres must load `shared_preload_libraries=pg_stat_statements` and the data migration must create the extension.
      operationId: listPGStatStatements
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPGStatStatementsResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/tables:
    get:
      tags: [Tables]
      summary: List tables
      operationId: listTables
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTablesResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Tables]
      summary: Create table
      operationId: createTable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/tables/{id}:
    delete:
      tags: [Tables]
      summary: Delete table
      operationId: deleteTable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTableResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/tables/{id}:rename:
    post:
      tags: [Tables]
      summary: Rename table
      operationId: renameTable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTableBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameTableResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/tables/{tableId}/schema:
    get:
      tags: [Tables]
      summary: Get table schema (columns + indexes)
      operationId: getTableSchema
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTableSchemaResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows:
    get:
      tags: [Tables]
      summary: List rows (paginated)
      operationId: listRows
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
          description: Also accepted as `page_size`.
        - name: pageToken
          in: query
          schema:
            type: string
          description: Also accepted as `page_token`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRowsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [Tables]
      summary: Create row
      operationId: createRow
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRowBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows/{rowId}:
    patch:
      tags: [Tables]
      summary: Update row
      operationId: updateRow
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
        - $ref: "#/components/parameters/RowIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRowBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tables]
      summary: Delete row
      operationId: deleteRow
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
        - $ref: "#/components/parameters/RowIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows:query:
    post:
      tags: [Tables]
      summary: Query rows with filter, sort, and projection
      operationId: queryRows
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRowsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryRowsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows:bulkUpsert:
    post:
      tags: [Tables]
      summary: Bulk upsert rows
      operationId: bulkUpsertRows
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpsertRowsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpsertRowsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows:bulkDelete:
    post:
      tags: [Tables]
      summary: Bulk delete rows
      operationId: bulkDeleteRows
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRowsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteRowsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/tables/{tableId}/rows:import:
    post:
      tags: [Tables]
      summary: Import rows (bulk insert)
      operationId: importRows
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/TableIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRowsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/columns:
    get:
      tags: [Columns]
      summary: List columns for a table
      operationId: listColumns
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: table_id
          in: query
          required: true
          schema:
            type: string
          description: Logical table id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListColumnsResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Columns]
      summary: Add column
      operationId: addColumn
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddColumnRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColumnResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/columns/{id}:
    patch:
      tags: [Columns]
      summary: Update column
      operationId: updateColumn
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColumnBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateColumnResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Columns]
      summary: Delete column
      operationId: deleteColumn
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteColumnResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/indexes:
    get:
      tags: [Indexes]
      summary: List indexes for a table
      operationId: listIndexes
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: table_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIndexesResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Indexes]
      summary: Create index
      operationId: createIndex
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndexRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIndexResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/indexes/{id}:
    get:
      tags: [Indexes]
      summary: Get index by id
      operationId: getIndex
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIndexResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Indexes]
      summary: Delete index
      operationId: deleteIndex
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteIndexResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/schema/er:
    get:
      tags: [Schema]
      summary: Get ER diagram (tables, columns, relations)
      operationId: getERDiagram
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetERDiagramResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/relations:
    get:
      tags: [Relations]
      summary: List relations
      operationId: listRelations
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: table_id
          in: query
          schema:
            type: string
          description: Filter by table id (optional).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRelationsResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Relations]
      summary: Create relation
      operationId: createRelation
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRelationResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/relations/{id}:
    delete:
      tags: [Relations]
      summary: Delete relation
      operationId: deleteRelation
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRelationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/queries:
    get:
      tags: [Queries]
      summary: List saved queries
      operationId: listQueries
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: table_id
          in: query
          schema:
            type: string
          description: Filter by table id (optional).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListQueriesResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Queries]
      summary: Create a saved query
      operationId: createQuery
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQueryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQueryResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/admin/queries/{id}:
    get:
      tags: [Queries]
      summary: Get a saved query
      operationId: getQuery
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetQueryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Queries]
      summary: Update a saved query
      operationId: updateQuery
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateQueryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Queries]
      summary: Delete a saved query
      operationId: deleteQuery
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteQueryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/data/queries/{id}:
    post:
      tags: [Queries]
      summary: Execute a saved query
      operationId: executeQuery
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteQueryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteQueryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Tenant identifier. Required in multi-tenant mode (`TENANT_MODE=multi`) to route
        to the tenant's Postgres database. Also accepted as `X-Tenant-ID`.
      schema:
        type: string
        example: default
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    TableIdPath:
      name: tableId
      in: path
      required: true
      schema:
        type: string
    RowIdPath:
      name: rowId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error message (plain text from http.Error)
      content:
        text/plain:
          schema:
            type: string
            example: table_id query parameter is required

  schemas:
    Value:
      type: object
      description: Cell value union (one field set per value).
      properties:
        stringValue:
          type: string
        numberValue:
          type: number
          format: double
        boolValue:
          type: boolean
        timestampValue:
          type: string
          format: date-time
        bytesValue:
          type: string
          format: byte
        jsonValue: {}

    Row:
      type: object
      properties:
        id:
          type: string
        cells:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Value"

    Type:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        pgType:
          type: string
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Table:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        schemaName:
          type: string
        tableName:
          type: string
        idType:
          type: string
          description: Logical type id of the physical row id column (from PG catalog).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Column:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        name:
          type: string
        typeId:
          type: string
        pgColumn:
          type: string
        isNullable:
          type: boolean
        position:
          type: integer
          format: int32
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Index:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
        name:
          type: string
        pgIndex:
          type: string
        columnIds:
          type: array
          items:
            type: string
        isUnique:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTenantRequest:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        dataDsn:
          type: string
          description: Write DSN (alias of dataDsnWrite)
        dataDsnWrite:
          type: string
        dataDsnReads:
          type: array
          items:
            type: string
          description: Read-replica DSNs (row query / export / saved-query)
        poolMaxConns:
          type: integer
        createDatabase:
          type: boolean
        recordStore:
          type: string
