# Local/dev dependencies: Postgres + Redis + DbGate.
# Run from repo root: make docker-up
# Schema is NOT auto-applied. After postgres is up: make migrate
#   or: docker compose -f deploy/docker-compose.yml run --rm migrate
# Full stack (app + deps): make docker-up-stack

services:
  postgres:
    image: postgres:16
    container_name: lowcode-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lowcode
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates schema meta on POSTGRES_DB. Row tables live in public. Catalog DDL: make migrate.
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: lowcode-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dbgate:
    image: ccr.ccs.tencentyun.com/sola/dbgate:latest
    container_name: lowcode-dbgate
    ports:
      - "3000:3000"
    environment:
      CONNECTIONS: postgres,redis
      LABEL_postgres: lowcode
      SERVER_postgres: postgres
      USER_postgres: postgres
      PASSWORD_postgres: postgres
      PORT_postgres: "5432"
      DATABASE_postgres: lowcode
      ENGINE_postgres: postgres@dbgate-plugin-postgres
      LABEL_redis: redis
      SERVER_redis: redis
      PORT_redis: "6379"
      ENGINE_redis: redis@dbgate-plugin-redis
    volumes:
      - dbgate-data:/root/.dbgate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    profiles: [migrate]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lowcode-database:latest
    entrypoint: ["./migrate"]
    environment:
      META_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lowcode?search_path=meta
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: [stack]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lowcode-database:latest
    container_name: lowcode-server
    ports:
      - "8080:8080"
    environment:
      META_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lowcode?search_path=meta
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"
      HTTP_ADDR: :8080
      EVENT_BUS: redis
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg-data:
  dbgate-data:
