name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
      - name: Build
        run: |
          go build -o /tmp/lc-server ./cmd/server
          go build -o /tmp/lc-migrate ./cmd/migrate
          /tmp/lc-server -version
